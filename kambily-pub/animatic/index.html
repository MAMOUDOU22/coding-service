<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kambily — Animatique</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Animatique KAMBILY — « Les boutiques d'ici. Un seul panier. »
  Paramètres d'URL :
    ?format=16x9 | 9x16     (défaut 16x9)
    &cut=master | 15        (film maître 50 s ou spot 15 s)
    &t=12.5                 (fige l'image à 12,5 s — utilisé par le rendu)
    &cues=1                 (prompteur voix off pour l'enregistrement à l'image)
    &end=13                 (borne la lecture — ex. essai voix 0–13 s)
  Sans paramètre t, l'animatique se joue en temps réel (clic = pause).
  Les plans « PLAN TOURNÉ » sont des emplacements de prises de vues réelles :
  ils ne sont PAS des images finales.
-->
<style>
@font-face{font-family:P;src:url(assets/fonts/poppins-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:P;src:url(assets/fonts/poppins-500.woff2) format("woff2");font-weight:500}
@font-face{font-family:P;src:url(assets/fonts/poppins-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:P;src:url(assets/fonts/poppins-700.woff2) format("woff2");font-weight:700}
:root{
  --teal:#048B9A; --teal-d:#036f7b; --teal-dd:#02434b;
  --lime:#D9FF98; --lime-l:#F3FFE0; --lime-b:#BFE98A;
  --ink:#17181A; --g1:#F2F3F3; --g2:#E6E8E8; --g3:#9AA0A3; --g4:#5E6467; --white:#fff;
  --red:#D2453A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:P,Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--white)}
.abs{position:absolute}
.scene{position:absolute;inset:0;opacity:0}
.c{display:flex;align-items:center;justify-content:center}

/* ---------- Plans tournés (placeholders honnêtes) ---------- */
.plate{position:absolute;inset:0;overflow:hidden;background:linear-gradient(160deg,#3b3a36,#1d1f20 60%,#0f1213)}
.plate .sun{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.plate .tag{position:absolute;left:48px;top:44px;font:600 22px P;letter-spacing:.12em;color:#fff;background:rgba(0,0,0,.45);
  padding:10px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.25)}
.plate .desc{position:absolute;left:48px;top:98px;max-width:760px;font:400 22px/1.45 P;color:rgba(255,255,255,.82);
  background:rgba(0,0,0,.35);padding:12px 16px;border-radius:8px}
.v .plate .desc{max-width:900px;font-size:30px;top:260px}
.v .plate .tag{top:200px;font-size:28px}
.silh{position:absolute;background:#0b0d0e;border-radius:48% 48% 8px 8px / 30% 30% 8px 8px}

/* ---------- Typographie cinétique ---------- */
.kt{position:absolute;font-weight:700;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
.kt span{display:inline-block}
.sub{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;font:500 30px P;color:#fff;
  background:rgba(10,12,13,.72);padding:8px 18px;border-radius:8px;white-space:nowrap;opacity:0}
.v .sub{bottom:360px;font-size:38px;white-space:normal;width:880px;text-align:center}

/* ---------- Téléphone ---------- */
.phone{position:absolute;width:430px;height:900px;border-radius:64px;background:#121416;padding:14px;
  box-shadow:0 60px 120px -30px rgba(2,40,45,.55),0 0 0 2px #2b2f33 inset}
.phone .screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:#fff}
.phone .island{position:absolute;left:50%;top:26px;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000;z-index:50}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font:600 15px P;color:#fff}
.status.dark{color:var(--ink)}
.hdr{background:var(--teal);color:#fff;border-radius:0 0 26px 26px;padding:0 22px 20px;position:relative}
.hdr h1{font:600 24px P;display:flex;align-items:center;gap:14px}
.hdr .arrow{font-size:24px;font-weight:400}
.view{position:absolute;left:0;right:0;top:0;bottom:0;background:#fff}
.pad{padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--g1);border-radius:12px;padding:8px 12px;font:500 14px P;color:var(--ink)}
.tile{background:var(--g1);border-radius:14px;display:flex;align-items:center;justify-content:center}
.tile svg{width:38%;height:38%;stroke:#B8BDBF;fill:none;stroke-width:1.6}
.muted{color:var(--g3)}
.price{color:var(--teal);font-weight:600}
.btn{border-radius:14px;font:600 17px P;display:flex;align-items:center;justify-content:center;height:54px}
.btn.teal{background:var(--teal);color:#fff}
.btn.lime{background:var(--lime);color:var(--teal-dd)}
.btn.out{border:1.5px solid var(--g2);color:var(--teal);background:#fff}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--lime-l);border:1px solid #E3F5C8;color:var(--teal);
  font:600 14px P;display:flex;align-items:center;justify-content:center;flex:none}
.box{border-radius:16px;border:1.5px solid var(--g2);background:#fff}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #C8CCCE;flex:none;position:relative}
.radio.on{border-color:var(--teal)}
.radio.on:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--teal)}
.check{width:22px;height:22px;border-radius:6px;background:var(--teal);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:1px solid var(--g2);background:#fff;display:flex;justify-content:space-around;
  align-items:center;font:500 12px P;color:var(--g3)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tabbar .on{color:var(--teal)}
.badge{position:absolute;top:-6px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font:600 11px P;
  display:flex;align-items:center;justify-content:center}
.tap{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(4,139,154,.25);
  border:2px solid rgba(4,139,154,.6);opacity:0;z-index:60;pointer-events:none}

/* ---------- Carte boutique (motif graphique) ---------- */
.shopcard{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 20px 14px 14px;
  box-shadow:0 18px 40px -16px rgba(2,60,66,.35);font:600 20px P;white-space:nowrap}
.shopcard .avatar{width:48px;height:48px;font-size:16px}

/* ---------- Divers ---------- */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#hud{position:absolute;right:16px;top:12px;font:500 14px P;color:rgba(255,255,255,.75);background:rgba(0,0,0,.4);padding:4px 10px;border-radius:6px;z-index:999}
.safe{position:absolute;border:2px dashed rgba(255,0,90,.55);pointer-events:none;z-index:998;display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script src="vo-cues.js"></script>
<script>
/* =====================================================================
   Paramètres
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const V = Q.get('format') === '9x16';
const CUT = Q.get('cut') === '15' ? '15' : 'master';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const DUR = Q.has('end') ? +Q.get('end') : (CUT === '15' ? 15 : 52);
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
if (V) document.body.classList.add('v');
function fit(){ const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W*s)/2}px,${(innerHeight - H*s)/2}px) scale(${s})`; }
addEventListener('resize', fit); fit();

/* =====================================================================
   Outils d'animation
   ===================================================================== */
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg = (t,a,b)=>clamp((t-a)/(b-a));
const lerp = (a,b,p)=>a+(b-a)*p;
// Courbes : on évite le linéaire. outExpo = arrivée « posée », inOut = déplacements de caméra.
const E = {
  out:p=>1-Math.pow(1-p,3),
  outExpo:p=>p===1?1:1-Math.pow(2,-10*p),
  inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  in:p=>p*p*p,
  back:p=>{const c=1.4;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)},
};
const tw = (t,a,b,ease=E.out)=>ease(seg(t,a,b));
function el(html, parent=stage){ const d=document.createElement('div'); d.innerHTML=html.trim(); const n=d.firstElementChild; parent.appendChild(n); return n; }
function css(n, o){ for (const k in o) n.style[k]=o[k]; }
function show(n, op){ n.style.opacity = op; n.style.visibility = op<=0.001 ? 'hidden':'visible'; }
const fmt = n => n.toLocaleString('fr-FR').replace(/ | /g,' ');

/* Icônes contour (même famille visuelle que l'écran « Catégories ») */
const IC = {
  shirt:'<svg viewBox="0 0 24 24"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3c-1 2-2.5 3-4 3S9 5 8 3z"/></svg>',
  bag:'<svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M9 10a3 3 0 006 0"/></svg>',
  tv:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/></svg>',
  laptop:'<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M3 19h18"/></svg>',
  basket:'<svg viewBox="0 0 24 24"><path d="M4 10h16l-2 9H6zM8 10l4-6 4 6M9 14v2M15 14v2M12 14v2"/></svg>',
  head:'<svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M10 4l1.5 5.5L17 11l-5.5 1.5L10 18l-1.5-5.5L3 11l5.5-1.5zM18 3v4M16 5h4M6 18a1.6 1.6 0 110 .1"/></svg>',
  store:'<svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9c0 2 4 2 4 0 0 2 4 2 4 0 0 2 4 2 4 0 0 2 4 2 4 0M10 20v-5h4v5"/></svg>',
  watch:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M9 3h6l1 4M9 21h6l1-4M8 7l1-4M8 17l1 4M12 10v2l1 1"/></svg>',
  shoe:'<svg viewBox="0 0 24 24"><path d="M3 16v-5l4-1 3 3 5 1 6 2v3H3zM3 19h18"/></svg>',
  bottle:'<svg viewBox="0 0 24 24"><path d="M10 3h4v4l2 2v12H8V9l2-2z"/><path d="M8 13h8"/></svg>',
  search:'<svg viewBox="0 0 24 24" style="stroke:#7d8487"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
};

/* =====================================================================
   Construction des écrans (reproductions fidèles des captures fournies)
   ===================================================================== */
function phone(parent){
  const p = el(`<div class="phone"><div class="island"></div><div class="screen"></div></div>`, parent);
  return p;
}
const statusBar = (dark)=>`<div class="status ${dark?'dark':''}"><span>07:19</span><span>●●● ▮</span></div>`;
const header = (title, right='')=>`<div class="hdr">${statusBar()}<h1><span class="arrow">←</span>${title}<span style="margin-left:auto">${right}</span></h1></div>`;

/* Écran Catégories (capture « Catégories ») */
const CATS = [
  ['Abaya',29,'shirt'],['Accessoires',38,'bag'],['Accessoires fe…',16,'shirt'],
  ['Alimentation & …',18,'basket'],['Audio & Son',20,'head'],['Beauté & Soins',196,'spark'],
  ['Câbles, Adapta…',20,'store'],['Chaussures',145,'shirt'],['Chaussures po…',37,'shirt'],
  ['Cosmétiques',193,'spark'],['Divers',24,'spark'],['Électronique',125,'tv'],
  ['Parfumerie',85,'spark'],['Smart Watch',5,'watch'],['Téléphones et …',19,'laptop'],
];
function screenCategories(scr){
  const v = el(`<div class="view">${header('Catégories','<svg viewBox="0 0 24 24" width="24" height="24" style="stroke:#fff;fill:none;stroke-width:2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>')}
    <div class="pad"><div style="background:var(--g1);border-radius:12px;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;font:400 15px P;color:#7d8487">
    <span style="width:20px;height:20px;display:inline-block">${IC.search}</span>Rechercher une catégorie…</div></div>
    <div class="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:0 18px;background:#fff;position:relative"></div>
    <div class="tabbar"><div class="on">⌂<span>Accueil</span></div><div>▤<span>Boutiques</span></div><div>🛒<span>Panier</span></div><div>☰<span>Menu</span></div></div></div>`, scr);
  const g = v.querySelector('.grid');
  const tiles = CATS.map(([n,c,i])=>el(`<div><div class="tile" style="height:104px">${IC[i]}</div>
     <div style="font:500 14px P;margin-top:6px;white-space:nowrap;overflow:hidden">${n}</div><div class="muted" style="font:400 12px P">${c} produits</div></div>`, g));
  return {v, tiles};
}

/* Liste produits (captures « Beauté & Soins », « Chaussures », « Électronique ») */
const LISTS = {
  'Beauté & Soins': {count:196, items:[
    ['Mixa Niacimanide','Mamadou Alpha Bah',220000,'bottle'],['The Ordinary — Tonique Exfoliant à l’Acide Glyc…','Abdalah',190000,'img:p-ordinary.jpg'],
    ['Vaseline Body Wash Smooth Glow','Abdalah',85000,'bottle'],['NIVEA Body Lotion Firming Q10 + Vitamin …','Abdalah',55000,'bottle']]},
  'Chaussures': {count:145, items:[
    ['BAPE STA','Mouctar Bah',170000,'shoe'],['Adidas Gazelle II','Mouctar Bah',170000,'shoe'],
    ['Adidas Superstar','Mouctar Bah',170000,'shoe'],['Reebok','Diouma diwe',190000,'shoe']]},
  'Électronique': {count:125, items:[
    ['Hub USB-C Multiport (ou Adaptateur Multip…','Tombon (Electro)',140000,'store'],['casque gaming HP H120G','Tombon (Electro)',180000,'head'],
    ['Philips GC3820','Tombon (Electro)',85000,'tv'],['Apple Watch Ultra 2','Tombon (Electro)',205000,'watch']]},
};
function screenList(scr, cat){
  const L = LISTS[cat];
  const v = el(`<div class="view">${header(cat)}
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--g2)">
      <span class="muted" style="font:400 15px P">${L.count} produits</span>
      <span style="display:flex;gap:8px"><span class="chip">⇅ Pertinence</span><span class="chip">☰ Filtrer</span></span></div>
    <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:16px 18px"></div></div>`, scr);
  const g = v.querySelector('.grid');
  const cards = L.items.map(([n,s,p,img])=>el(`<div>
    <div class="tile" style="height:178px;overflow:hidden;${img.startsWith('img:')?'background:#fff':''}">${img.startsWith('img:')?`<img src="assets/${img.slice(4)}" style="height:100%">`:IC[img]}</div>
    <div style="font:500 15px/1.3 P;margin-top:8px;height:40px;overflow:hidden">${n}</div>
    <div class="muted" style="font:400 13px P;margin-top:2px">${s}</div>
    <div class="price" style="font-size:17px;margin-top:2px">${fmt(p)} GNF</div></div>`, g));
  return {v, cards};
}

/* Fiche produit (mise en page de la capture « Abaya Élégance Bicolore »,
   données limitées à ce qui est connu pour ce produit : nom, prix, boutique) */
function screenProduct(scr){
  const v = el(`<div class="view">
    <div style="height:400px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative">
      <img src="assets/p-ordinary.jpg" style="height:330px">
      <div style="position:absolute;left:20px;top:60px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)" class="c">←</div>
      <div style="position:absolute;right:20px;top:60px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)" class="c">♡</div>
    </div>
    <div class="pad">
      <div style="font:600 21px/1.3 P">The Ordinary — Tonique Exfoliant à l’Acide Glyc…</div>
      <div class="price" style="font-size:30px;margin-top:6px">190 000 GNF</div>
      <div class="box" style="margin-top:16px;padding:14px">
        <div style="display:flex;align-items:center;gap:12px"><div class="avatar">A</div><div style="font:600 17px P">Abdalah</div></div>
        <div class="btn out" style="height:44px;margin-top:12px;font-size:15px;color:var(--ink)">Voir la boutique</div>
      </div>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 18px 26px;display:flex;gap:12px;background:#fff;border-top:1px solid var(--g2)">
      <div class="btn lime addbtn" style="flex:1;font-size:15px">Ajouter au panier</div>
      <div class="btn teal" style="flex:1;font-size:15px">Acheter mainten…</div></div>
  </div>`, scr);
  return {v, add:v.querySelector('.addbtn')};
}

/* Panier (capture « Panier ») — deux boutiques sélectionnées */
function screenCart(scr){
  const shop = (av,name,img,title,price)=>`<div class="box shop" style="margin-top:14px;padding:14px">
    <div style="display:flex;align-items:center;gap:12px"><div class="check">✓</div><div class="avatar">${av}</div><div style="font:600 17px P">${name}</div><span style="margin-left:auto;color:var(--teal)">›</span></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--g2)">
      <div class="check">✓</div><div class="tile" style="width:74px;height:74px;background:#fff;overflow:hidden"><img src="assets/${img}" style="height:100%"></div>
      <div style="flex:1;min-width:0"><div style="font:500 15px P;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div><div class="price" style="font-size:18px">${price}</div></div>
      <div style="display:flex;align-items:center;gap:8px;font:500 15px P"><span class="chip" style="padding:4px 10px">−</span>1<span class="chip" style="padding:4px 10px">+</span></div></div>
  </div>`;
  const v = el(`<div class="view">
    <div class="hdr">${statusBar()}<h1>Panier<span style="margin-left:auto;font-size:20px">🗑</span></h1></div>
    <div class="pad">
      <div class="banner" style="background:var(--g1);border-radius:14px;padding:14px;font:600 16px P;display:flex;gap:10px;align-items:center">
        <span style="color:var(--teal)">🛍</span><span class="bt">2 boutiques. Un seul panier.</span></div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:14px;font:400 15px P"><div class="check">✓</div>Tout sélectionner (2)<span style="margin-left:auto;color:var(--red)">Supprimer</span></div>
      ${shop('A','Abdalah','p-ordinary.jpg','The Ordinary — Tonique Exf…','190 000')}
      ${shop('T(','Tombon (Electro)','p-hp.jpg','HP EliteBook x360 1040 G6 …','4 130 000')}
    </div>
    <div style="position:absolute;left:0;right:0;bottom:78px;padding:12px 18px;background:#fff">
      <div class="btn teal payb">Passer au paiement</div>
      <div class="btn lime" style="margin-top:10px;height:48px">⤳ Partager mon panier</div></div>
    <div class="tabbar"><div>⌂<span>Accueil</span></div><div>▤<span>Boutiques</span></div><div class="on">🛒<span>Panier</span><b class="badge">2</b></div><div>☰<span>Menu</span></div></div>
  </div>`, scr);
  return {v, shops:[...v.querySelectorAll('.shop')], banner:v.querySelector('.banner'), pay:v.querySelector('.payb')};
}

/* Stepper commun Livraison / Paiement / Confirmation */
const stepper = (k)=>{ const s=['Livraison','Paiement','Confirmation'];
  return `<div style="display:flex;justify-content:space-between;padding:16px 26px 8px">${s.map((n,i)=>`<div style="text-align:center;font:500 13px P;color:${i<=k?'var(--teal)':'var(--g3)'}">
  <div style="width:34px;height:34px;border-radius:50%;margin:0 auto 4px;background:${i<=k?'var(--teal)':'var(--g1)'};color:${i<=k?'#fff':'var(--g3)'}" class="c">${i+1}</div>${n}</div>`).join('')}</div>`; };

/* Livraison (capture « Livraison ») */
function screenDelivery(scr){
  const v = el(`<div class="view">${header('Livraison')}${stepper(0)}
   <div class="pad" style="padding-top:6px">
    <div style="font:600 18px P">Mode de réception</div>
    <div class="box" style="border-color:var(--teal);margin-top:10px;padding:14px;display:flex;gap:12px;align-items:center">

/* =====================================================================
   Logo — on utilise le pictogramme officiel extrait du fichier fourni
   (jamais redessiné). Le mot « kambily » est un PLACEHOLDER typographique
   à remplacer par le fichier vectoriel officiel du logotype.

const kmark = (cls='white', size=200)=>`<img src="assets/k-mark-${cls}.png" style="width:${size}px;height:${size}px;display:block">`;

/* =====================================================================
   SCÈNES — film maître (50 s)
   Chaque scène : build() crée le DOM, upd(t) pose l'état à l'instant t.
   ===================================================================== */
const S = [];
function scene(a,b,build){ const root = el(`<div class="scene"></div>`); const upd = build(root); S.push({a,b,root,upd}); }
const sub = el(`<div class="sub"></div>`);

/* Position du téléphone selon le format */
const PH = V ? {x:(W-430*1.32)/2, y:480, s:1.32} : {x:W*0.62-215, y:(H-900)/2, s:1};
function placePhone(p, x=PH.x, y=PH.y, s=PH.s, r=0){ css(p,{left:x+'px',top:y+'px',transform:`scale(${s}) rotate(${r}deg)`,transformOrigin:'0 0'}); }

/* ---- Plan 1 · 0:00–0:05 · Accroche : la ville, une liste, deux boutiques éloignées ---- */
function plan1(root, T0, LEN){
  const pl = el(`<div class="plate">
    <div class="sun" style="width:900px;height:600px;left:55%;top:-20%;background:#f5b56a"></div>
    <div class="sun" style="width:700px;height:500px;left:-10%;top:50%;background:#2d6b70"></div>
    <div class="silh" style="width:${V?420:300}px;height:${V?900:620}px;left:${V?330:220}px;bottom:-40px"></div>
    <div class="tag">PLAN TOURNÉ 1</div>
    <div class="desc">Conakry, matin. Rue commerçante animée, lumière rasante. Aminata (≈27 ans) au bord de la route, téléphone en main. Plan serré sur son visage : elle fait le calcul — deux achats, deux boutiques, deux trajets.</div></div>`, root);
  // Carte stylisée : deux repères qui s'éloignent (le problème)
  const map = el(`<div class="abs" style="left:${V?80:900}px;top:${V?1050:260}px;width:${V?920:880}px;height:${V?520:560}px"></div>`, root);
  const pin = (x,y,label)=>el(`<div class="abs" style="left:${x}px;top:${y}px;opacity:0"><div class="shopcard" style="position:relative"><div class="avatar">${label[0]}</div>${label}</div></div>`, map);
  const p1 = pin(0, 40, 'Abdalah · Beauté'), p2 = pin(V?420:480, V?320:380, 'Tombon (Electro)');
  const line = el(`<svg class="abs" style="left:0;top:0;overflow:visible" width="100%" height="100%"><path d="M180 120 C 400 120, 300 ${V?380:430}, ${V?560:620} ${V?400:450}" stroke="#fff" stroke-width="4" stroke-dasharray="10 14" fill="none" stroke-linecap="round"/></svg>`, map);
  const path = line.querySelector('path'); const L = path.getTotalLength ? 900 : 900;
  path.style.strokeDasharray = '10 14';
  const kt = el(`<div class="kt" style="color:#fff;font-size:${V?82:76}px;left:${V?80:120}px;top:${V?620:H-300}px">
     <div class="l1">Un produit ici.</div><div class="l2" style="color:var(--lime)">L'autre, là-bas.</div></div>`, root);
  return t=>{
    const k = seg(t,T0,T0+LEN);
    css(pl,{transform:`scale(${1.08-0.06*k})`});              // lent push-out caméra
    show(p1, tw(t,T0+0.8,T0+1.4)); css(p1,{transform:`translateY(${(1-tw(t,T0+0.8,T0+1.4,E.back))*30}px)`});
    show(p2, tw(t,T0+1.6,T0+2.2)); css(p2,{transform:`translateY(${(1-tw(t,T0+1.6,T0+2.2,E.back))*30}px)`});
    show(line, tw(t,T0+1.4,T0+2.2));
    const l1 = kt.querySelector('.l1'), l2 = kt.querySelector('.l2');
    show(l1, tw(t,T0+0.4,T0+1.0)); css(l1,{transform:`translateY(${(1-tw(t,T0+0.4,T0+1.0,E.outExpo))*40}px)`});
    show(l2, tw(t,T0+1.6,T0+2.2)); css(l2,{transform:`translateY(${(1-tw(t,T0+1.6,T0+2.2,E.outExpo))*40}px)`});
    // Fin de plan : les deux repères se rapprochent l'un de l'autre (amorce du raccord)
    const j = tw(t,T0+3.6,T0+LEN,E.inOut);
    css(map,{transform:`scale(${1-0.15*j})`});
    css(p2.firstElementChild,{transform:`translate(${-(V?380:440)*j}px,${-(V?250:310)*j}px)`});
    show(line, tw(t,T0+1.4,T0+2.2)*(1-j));
    show(kt, 1-tw(t,T0+3.8,T0+LEN));
  };
}

    // Les trois listes glissent l'une après l'autre (mouvement latéral, rythme ↗)

    [...kt.children].forEach((n,i)=>{ const q=tw(t,10.0+i*0.4,10.6+i*0.4,E.outExpo); show(n,q); css(n,{transform:`translateY(${(1-q)*36}px)`}); });

/* Sous-titres : issus de vo-cues.js (source unique du minutage voix) */
const SUBS = window.VO.master.filter(c=>c.sub).map(c=>[c.a-0.1,c.b+0.4,c.text]);

/* =====================================================================
   SPOT 15 s — remontage narratif (pas une accélération du film maître)
   Idée conservée : problème (2 boutiques) → solution (1 panier) → preuve (code) → marque.
   On réutilise les plans en remappant le temps.
   ===================================================================== */
const MAP15 = [ // [début15, fin15, début maître]
  [0,2.6,1.0],      // accroche : « Un produit ici. L'autre, là-bas. »
  [2.6,6.6,23.4],   // panier : « Plusieurs boutiques. Un seul panier. »
  [6.6,9.6,33.2],   // confirmation + code
  [9.6,11.4,37.0],  // remise du colis « Ton code. Ton colis. »
  [11.4,15,46.4],   // signature : logo sur « Kambily » à 12,5 s
];
const SUBS15 = window.VO['15'].filter(c=>c.sub).map(c=>[c.a-0.1,c.b+0.4,c.text]);

/* Prompteur voix off (?cues=1) : phrase en cours, mot-clé surligné à l'instant prévu */
const CUES = Q.get('cues')==='1';
const prompter = el(`<div class="abs" style="left:0;right:0;top:0;height:${V?150:96}px;background:rgba(0,0,0,.82);color:#fff;z-index:997;display:${CUES?'flex':'none'};
  align-items:center;gap:24px;padding:0 32px;font:500 ${V?34:30}px P"><span class="tc" style="font:600 22px P;color:var(--lime);min-width:120px"></span><span class="ln"></span>
  <span class="nx" style="margin-left:auto;font:400 20px P;opacity:.6;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span></div>`);
function drawCues(t){
  if(!CUES) return; const L = window.VO[CUT==='15'?'15':'master'];
  const cur = L.find(c=>t>=c.a-0.35 && t<c.b+0.2), nxt = L.find(c=>c.a>t);
  prompter.querySelector('.tc').textContent = t.toFixed(1)+' s';
  const ln = prompter.querySelector('.ln');
  if(cur){ const hot = t>=cur.keyAt-0.25 && t<cur.keyAt+0.35;
    ln.innerHTML = cur.text.replace(cur.key, `<b style="color:${hot?'#111':'var(--lime)'};background:${hot?'var(--lime)':'transparent'};border-radius:6px;padding:0 6px">${cur.key}</b>`);
    ln.style.opacity = t<cur.a ? .5 : 1; }
  else ln.innerHTML = '<span style="opacity:.45">— silence / image —</span>';
  prompter.querySelector('.nx').textContent = nxt ? `→ ${nxt.a.toFixed(1)} s « ${nxt.text} »` : '';
}

/* =====================================================================
   Moteur de rendu
   ===================================================================== */
el(`<div class="grain"></div>`);
stage.appendChild(sub);
const safe = el(`<div class="safe"></div>`);
if (V) css(safe,{left:'60px',right:'140px',top:'220px',bottom:'340px'}); else css(safe,{left:'96px',right:'96px',top:'54px',bottom:'54px'});
if (Q.get('safe')==='1') safe.style.display='block';

function masterTime(t){
  if (CUT !== '15') return t;
  for (const [a,b,m] of MAP15) if (t>=a && t<b) return m + (t-a);
  return 51.9;
}
function render(t){
  const tm = masterTime(t);
  for (const s of S){
    const on = tm>=s.a && tm<s.b;
    if (!on){ show(s.root,0); continue; }
    // fondu court d'entrée de 0,2 s (les raccords forts sont gérés dans les scènes)
    show(s.root, 1);
    s.upd(tm);
  }
  // L'ordre DOM = ordre des scènes : une scène qui commence recouvre la précédente.
  const list = CUT==='15' ? SUBS15 : SUBS; let txt='';
  for (const [a,b,s] of list) if (t>=a && t<b) txt=s;
  sub.textContent = txt; show(sub, txt?1:0);
  drawCues(t);
  document.getElementById('hud').textContent = `${CUT==='15'?'15 s':'Maître'} · ${V?'9:16':'16:9'} · ${t.toFixed(2)} s`;
}
window.__render = render; window.__dur = DUR;
if (Q.has('t')) { document.getElementById('hud').style.display='none'; render(parseFloat(Q.get('t'))); }
else {
  let t0 = performance.now(), paused=false, pt=0;
  addEventListener('click',()=>{ paused=!paused; if(!paused) t0=performance.now()-pt*1000; });
  (function loop(){ if(!paused){ pt=((performance.now()-t0)/1000)%DUR; render(pt);} requestAnimationFrame(loop); })();
}
</script>
